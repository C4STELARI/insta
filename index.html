<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Insta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="perfil">
        <header class="topo">
            <div class="logo">Insta</div>
            <div class="login">
                <button>Entrar</button>
                <button>Cadastre-se</button>
            </div>
        </header>

        <section class="cabecalho">
            <div class="foto">
                <img src="foto-perfil.webp" alt="Foto de perfil">
            </div>

            <div class="info">
                <h1>Alisson</h1>
                <p>Aracaju, Sergipe, Brasil</p>
                <p>Não sei, não quero saber, e tenho raiva de quem sabe.</p>

                <div class="botoes">
                    <button>Seguir</button>
                    <button>Enviar mensagem</button>
                </div>
            </div>
        </section>

        <main class="conteudo">
            <section class="destaques">
                <div class="destaque"><img src="foto-perfil.webp" alt=""><p>Viagem</p></div>
                <div class="destaque"><img src="foto-perfil.webp" alt=""><p>Amigos</p></div>
                <div class="destaque"><img src="foto-perfil.webp" alt=""><p>Jogos</p></div>
                <div class="destaque"><img src="foto-perfil.webp" alt=""><p>Fotos</p></div>
                <div class="destaque"><img src="foto-perfil.webp" alt=""><p>Rolês</p></div>
                <div class="destaque"><img src="foto-perfil.webp" alt=""><p>2026</p></div>
            </section>

            <section class="feed">
                <h2>Publicações</h2>
                <div class="posts">
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                    <div class="post"><img src="foto-perfil.webp" alt=""></div>
                </div>
            </section>

            <section class="conquistas">
                <h2>Conquistas mais raras</h2>
                <div class="lista">
                    <div class="conquista"><img src="https://shared.fastly.steamstatic.com/community_assets/images/apps/1235140/2a976280a73e1083434a6de2b18c3cf7c3ad61f8.jpg" alt=""></div>
                    <div class="conquista">2</div>
                    <div class="conquista">3</div>
                    <div class="conquista">4</div>
                    <div class="conquista">5</div>
                    <div class="conquista">6</div>
                    <div class="conquista">7</div>
                    <div class="conquista">8</div>
                    <div class="conquista">9</div>
                    <div class="conquista">10</div>
                    <div class="conquista">11</div>
                    <div class="conquista">12</div>
                    <div class="conquista">13</div>
                    <div class="conquista">14</div>
                    <div class="conquista">15</div>
                </div>

                <div class="estatisticas">
                    <div><strong>1.692</strong><p>Conquistas</p></div>
                    <div><strong>7</strong><p>Jogos perfeitos</p></div>
                    <div><strong>33%</strong><p>Média de conquistas por jogo</p></div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
